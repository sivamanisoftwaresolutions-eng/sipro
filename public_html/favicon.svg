  <g stroke="#ffffff" stroke-width="1.2" opacity="0.65">
    <line x1="50" y1="46" x2="80" y2="36" />
    <line x1="80" y1="36" x2="106" y2="58" />
    <line x1="106" y1="58" x2="68" y2="76" />
    <line x1="68" y1="76" x2="34" y2="76" />
    <line x1="34" y1="76" x2="56" y2="104" />
    <line x1="56" y1="104" x2="94" y2="114" />
    <line x1="94" y1="114" x2="72" y2="142" />

    <line x1="140" y1="40" x2="180" y2="34" />
    <line x1="180" y1="34" x2="226" y2="54" />
    <line x1="226" y1="54" x2="236" y2="82" />
    <line x1="236" y1="82" x2="210" y2="118" />
    <line x1="210" y1="118" x2="164" y2="124" />
    <line x1="140" y1="40" x2="140" y2="100" />
    <line x1="140" y1="100" x2="140" y2="168" />
  </g>
  <g fill="#ffffff" opacity="0.9">
    <circle cx="50" cy="46" r="2.8" />
    <circle cx="80" cy="36" r="2.8" />
    <circle cx="106" cy="58" r="3" />
    <circle cx="68" cy="76" r="2.8" />
    <circle cx="56" cy="104" r="2.8" />
    <circle cx="94" cy="114" r="3" />
    <circle cx="72" cy="142" r="3" />
    
    <circle cx="140" cy="40" r="2.8" />
    <circle cx="180" cy="34" r="3" />
    <circle cx="226" cy="54" r="3.2" />
    <circle cx="236" cy="82" r="3.5" />
    <circle cx="210" cy="118" r="3" />
    <circle cx="164" cy="124" r="2.8" />
    <circle cx="140" cy="168" r="3" />
