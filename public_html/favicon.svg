<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="fav-grad-s" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <linearGradient id="fav-grad-p" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <radialGradient id="fav-ocean" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
  </defs>
  <!-- Dark Navy Pill Background for Favicon Distinction -->
  <rect width="256" height="256" rx="56" fill="#0f172a" />
  
  <!-- Outer Subtle Tech Border -->
  <rect x="2" y="2" width="252" height="252" rx="54" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3" />

  <!-- S glyph -->
  <path d="M 108,72 C 108,52 92,42 72,42 C 48,42 32,54 32,74 C 32,106 102,94 102,122 C 102,140 86,152 62,152 C 36,152 22,136 20,116 L 42,112 C 44,124 52,134 64,134 C 76,134 84,126 84,114 C 84,82 14,94 14,66 C 14,46 32,28 70,28 C 102,28 124,44 126,72 Z" fill="url(#fav-grad-s)" />
  
  <!-- P glyph -->
  <path d="M 130,30 L 194,30 C 224,30 244,48 244,82 C 244,116 224,134 194,134 L 156,134 L 156,176 L 130,176 Z M 156,50 L 156,114 L 192,114 C 210,114 220,102 220,82 C 220,62 210,50 192,50 Z" fill="url(#fav-grad-p)" />

