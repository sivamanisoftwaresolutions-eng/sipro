    <!-- Continents -->
    <path d="M -12,-8 C -8,-14 0,-12 4,-8 C 2,-2 -4,2 -6,8 C -12,4 -14,-2 -12,-8 Z" fill="#10b981" opacity="0.95" />
    <circle cx="8" cy="4" r="4" fill="#10b981" opacity="0.9" />
    <circle cx="0" cy="0" r="24" stroke="rgba(56,189,248,0.7)" stroke-width="1.5" fill="none" />
    <circle cx="-5" cy="-6" r="6" fill="#ffffff" opacity="0.3" />
