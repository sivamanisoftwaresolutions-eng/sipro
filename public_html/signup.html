<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Create an Account | SiPro Technologies</title>
  <meta name="description" content="Create your SiPro Technologies account to launch enterprise engineering pods, track milestones, or enroll in talent tracks.">
  <link rel="stylesheet" href="sipro.css">
</head>
<body data-page="signup.html">
  <div data-header></div>

  <main class="auth-page-shell">
    <div class="auth-card" data-standalone-auth="signup">
      <div class="auth-card-header">
        <div class="auth-card-brand">
          <img src="/logo.svg" alt="SiPro Technologies" style="height:48px;width:auto;" />
        </div>
        <h1 class="auth-card-title">Get started with SiPro</h1>
        <p class="auth-card-subtitle">Enterprise engineering, cloud delivery & talent acceleration</p>
      </div>

      <div class="auth-tabs">
        <button type="button" class="auth-tab" data-tab="signin">Sign In</button>
        <button type="button" class="auth-tab active" data-tab="signup">Create Account</button>
      </div>

      <!-- Social OAuth -->
      <div class="oauth-buttons">
        <button type="button" class="oauth-btn" data-oauth="google">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          <span>Google</span>
        </button>
        <button type="button" class="oauth-btn" data-oauth="github">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor"><path fill-rule="evenodd" clip-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.53 1.032 1.53 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z"/></svg>
          <span>GitHub</span>
        </button>
      </div>

      <div class="auth-divider">
        <span>or create with work email</span>
      </div>

      <!-- Sign In Form (hidden by default) -->
      <form class="auth-form" id="standalone-signin-form" style="display:none">
        <div class="form-group">
          <label for="standalone-signin-email">Work / Personal Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input id="standalone-signin-email" class="auth-input" type="email" required placeholder="you@company.com">
          </div>
        </div>

        <div class="form-group">
          <label for="standalone-signin-password">Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="standalone-signin-password" class="auth-input" type="password" required placeholder="Enter your password">
          </div>
        </div>

        <button type="submit" class="btn btn-primary auth-submit-btn">
          <span class="btn-text">Sign In to SiPro</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <!-- Sign Up Form -->
      <form class="auth-form" id="standalone-signup-form">
        <div class="form-group">
          <label for="standalone-signup-name">Full Name</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            </span>
            <input id="standalone-signup-name" class="auth-input" type="text" required placeholder="e.g. Arjun Sharma" autocomplete="name">
          </div>
        </div>

        <div class="form-group">
          <label for="standalone-signup-email">Work Email</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
            </span>
            <input id="standalone-signup-email" class="auth-input" type="email" required placeholder="you@company.com" autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label>Select Workspace Role</label>
          <div class="role-pills">
            <label>
              <input type="radio" name="standalone-role" value="client" class="role-pill-radio" checked>
              <span class="role-pill-label">Enterprise Client</span>
            </label>
            <label>
              <input type="radio" name="standalone-role" value="candidate" class="role-pill-radio">
              <span class="role-pill-label">Candidate / Engineer</span>
            </label>
            <label>
              <input type="radio" name="standalone-role" value="employee" class="role-pill-radio">
              <span class="role-pill-label">Team Member</span>
            </label>
          </div>
        </div>

        <div class="form-group">
          <label for="standalone-signup-password">Create Password</label>
          <div class="input-wrapper">
            <span class="input-icon">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            </span>
            <input id="standalone-signup-password" class="auth-input" type="password" required placeholder="At least 8 characters" autocomplete="new-password">
            <button type="button" class="password-toggle-btn" aria-label="Show password">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
          <div class="strength-meter">
            <div class="strength-bars">
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
              <span class="strength-bar"></span>
            </div>
            <div class="strength-text">
              <span>Password strength</span>
              <strong id="standalone-strength-label">Empty</strong>
            </div>
          </div>
        </div>

        <label class="checkbox-label">
          <input type="checkbox" required checked style="position:absolute;opacity:0">
          <span class="custom-checkbox">✓</span>
          <span>I agree to the <a href="about.html">Terms of Service</a> & <a href="about.html">Privacy Policy</a></span>
        </label>

        <button type="submit" class="btn btn-primary auth-submit-btn">
          <span class="btn-text">Create Account</span>
          <span class="btn-spinner"></span>
        </button>
      </form>

      <div class="auth-card-footer">
        Already have an account? <a href="login.html">Sign in here</a>
      </div>
    </div>
  </main>

  <div data-footer></div>
  <script src="sipro.js"></script>
</body>
</html>
