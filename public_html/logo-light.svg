<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 54" width="100%" height="100%" fill="none">
  <defs>
    <!-- Emblem Background Gradient -->
    <linearGradient id="logo-emblem-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <!-- SP Lettermark Gradient -->
    <linearGradient id="logo-letter-grad-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>

    <!-- Globe Ocean Gradient -->
    <radialGradient id="logo-globe-ocean-light" cx="35%" cy="30%" r="65%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="85%" stop-color="#1e3a8a" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>

    <!-- Specular Highlight -->
    <radialGradient id="logo-globe-specular-light" cx="30%" cy="25%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Gradient for "Tech" Wordmark -->
    <linearGradient id="logo-tech-grad-light" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- ==================== 1. EMBLEM MONOGRAM (SP ICON) ==================== -->
  <g transform="translate(4, 3)">
    <!-- Main Gradient Rounded Card -->
    <rect x="0" y="0" width="48" height="48" rx="14" fill="url(#logo-emblem-grad-light)" stroke="rgba(37,99,235,0.2)" stroke-width="1.2" />

    <!-- Inner Top Glass Sheen -->
    <path d="M 0,14 C 0,6.2 6.2,0 14,0 L 34,0 C 41.8,0 48,6.2 48,14 L 48,22 C 34,26 14,24 0,22 Z" fill="#ffffff" opacity="0.22" />

    <!-- Constellation Network Edges (Subtle Architectural Mesh) -->
    <g stroke="#ffffff" stroke-width="0.8" opacity="0.45" stroke-linecap="round">
      <line x1="12" y1="14" x2="20" y2="10" />
      <line x1="20" y1="10" x2="28" y2="14" />
      <line x1="28" y1="14" x2="28" y2="24" />
      <line x1="28" y1="24" x2="20" y2="28" />
      <line x1="20" y1="28" x2="12" y2="24" />
      <line x1="12" y1="24" x2="12" y2="34" />
      <line x1="12" y1="34" x2="20" y2="38" />
      <line x1="20" y1="38" x2="28" y2="34" />
      <line x1="30" y1="14" x2="38" y2="14" />
      <line x1="38" y1="14" x2="42" y2="20" />
      <line x1="42" y1="20" x2="38" y2="26" />
      <line x1="38" y1="26" x2="30" y2="26" />
      <line x1="30" y1="26" x2="30" y2="38" />
    </g>

    <!-- Stylized "S" & "P" High-Contrast Lettermark -->
    <g fill="#ffffff" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-weight="900">
      <!-- 'S' Symbol -->
      <path d="M 23,16.5 C 23,13.8 20.8,12 17.5,12 C 14,12 11.5,13.8 11.5,16.8 C 11.5,21.5 22.8,19.8 22.8,25 C 22.8,28.2 20.2,30.5 16.5,30.5 C 12.5,30.5 9.8,28 9.5,24.2 L 13.5,23.5 C 13.7,25.8 14.8,27.2 16.6,27.2 C 18.5,27.2 19.5,26 19.5,24.8 C 19.5,20.2 8.2,21.8 8.2,16.8 C 8.2,12.2 12,9 17.5,9 C 22.8,9 26.2,12.2 26.2,16.5 Z" fill="url(#logo-letter-grad-light)" />

      <!-- 'P' Symbol -->
      <path d="M 26,10 L 35.5,10 C 40,10 43.5,12.8 43.5,17.8 C 43.5,22.8 40,25.6 35.5,25.6 L 29.8,25.6 L 29.8,32 L 26,32 Z M 29.8,13.4 L 29.8,22.2 L 35.2,22.2 C 37.8,22.2 39.6,20.6 39.6,17.8 C 39.6,15 37.8,13.4 35.2,13.4 Z" fill="url(#logo-letter-grad-light)" />
    </g>

    <!-- Constellation Node Micro-Dots -->
    <circle cx="17.5" cy="9" r="1.5" fill="#38bdf8" />
    <circle cx="26" cy="10" r="1.5" fill="#e0e7ff" />
    <circle cx="43.5" cy="17.8" r="1.5" fill="#38bdf8" />
    <circle cx="16.5" cy="30.5" r="1.5" fill="#e0e7ff" />
  </g>

  <!-- ==================== 2. BRAND TYPOGRAPHY ("SiProTech") ==================== -->
  <g transform="translate(64, 33)">
    <!-- "SiPro" in Obsidian Dark Display Letterforms for Light Backgrounds -->
    <text x="0" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="27" font-weight="800" fill="#0f172a" letter-spacing="-0.8">
      SiPro
    </text>

    <!-- 3D ORBITAL GLOBE (Positioned between SiPro and Tech) -->
    <g transform="translate(73, -8)">
      <!-- Ocean Base -->
      <circle cx="0" cy="0" r="7.5" fill="url(#logo-globe-ocean-light)" />

      <!-- Continents (Stylized Green landmasses) -->
      <g fill="#10b981" opacity="0.95">
        <path d="M -4.5,-4 C -3,-5 -1,-4.5 -0.5,-3 C 0,-1.5 -1,-0.5 -2.5,0 C -4,-0.5 -4.5,-2 -4.5,-4 Z" />
        <path d="M -2,1 C -0.5,1 1,2.5 1.2,4.5 C -0.5,6 -2.5,6 -2.8,4 C -3,2.5 -2.8,1.5 -2,1 Z" />
        <path d="M 1.5,-4 C 3.5,-4.5 5,-3.5 5.5,-2 C 4.5,-1 3.2,-1.5 2.2,-2.5 Z" />
        <path d="M 2.5,-1.5 C 4,-1 5.5,0.5 5,2.5 C 3.8,2.2 3,0.5 2.5,-1.5 Z" />
      </g>

      <!-- Atmospheric Ring -->
      <circle cx="0" cy="0" r="7.5" stroke="#0284c7" stroke-width="0.8" opacity="0.6" fill="none" />

      <!-- Specular 3D Curve -->
      <circle cx="0" cy="0" r="7.5" fill="url(#logo-globe-specular-light)" />
    </g>

    <!-- "Tech" in Radiant Amber Gradient -->
    <text x="86" y="0" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="27" font-weight="800" fill="url(#logo-tech-grad-light)" letter-spacing="-0.8">
      Tech
    </text>

    <!-- Professional Enterprise Subtitle: "TECHNOLOGIES" -->
    <text x="1.5" y="13" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="7.5" font-weight="700" fill="#475569" letter-spacing="3.8">
      TECHNOLOGIES
    </text>

    <!-- Global Edge Operational Indicator Dot -->
    <circle cx="152" cy="9" r="2.2" fill="#059669" />
  </g>
</svg>
